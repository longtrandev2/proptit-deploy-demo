# Nginx TRÊN HOST (cài bằng apt) — điểm vào duy nhất của hệ thống.
# Copy vào VPS:
#   sudo cp deploy/nginx/guestbook.conf /etc/nginx/sites-available/guestbook
#   sudo nano /etc/nginx/sites-available/guestbook      # thay api.example.com bằng tên miền của bạn
#   sudo ln -s /etc/nginx/sites-available/guestbook /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Sau đó chạy certbot: nó sẽ tự thêm khối "listen 443 ssl" và chuyển hướng HTTP -> HTTPS.

server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 1M;

    location / {
        # Container frontend chỉ bind 127.0.0.1:3000 -> chỉ Nginx này gọi được
        proxy_pass http://127.0.0.1:3000;

        # Ứng dụng phía sau chỉ thấy request đến từ 127.0.0.1 (chính Nginx),
        # nên phải gửi kèm thông tin gốc của người dùng:
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
