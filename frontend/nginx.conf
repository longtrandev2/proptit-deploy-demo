# Nginx BÊN TRONG container frontend:
#   - phục vụ file tĩnh (index.html, app.js, style.css)
#   - chuyển /api/* sang container backend qua mạng nội bộ Docker
# Nhờ vậy frontend và API cùng một origin -> trình duyệt không cần CORS.

# Nếu phía trước đã có Nginx trên host (đã xử lý HTTPS) thì giữ nguyên X-Forwarded-Proto của nó,
# nếu không thì dùng scheme của chính request này.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 là DNS nội bộ của Docker: phân giải tên service "backend" ra IP container.
    # Dùng biến + resolver để Nginx hỏi lại DNS mỗi 10 giây: khi backend được tạo lại (IP mới)
    # thì vẫn gọi đúng, và khi backend chết thì trả 502 thay vì Nginx không khởi động được.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
